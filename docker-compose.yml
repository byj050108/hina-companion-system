name: hina-companion-system

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      API_SERVER_HOST: 0.0.0.0
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - hermes-data:/opt/data

  companion-api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      HINA_STATE_DIR: /data
      HINA_API_HOST: 0.0.0.0
      HINA_API_PORT: 8787
      HINA_TIMEZONE: ${HINA_TIMEZONE:-Asia/Shanghai}
      HERMES_API_URL: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      TTS_ENDPOINT: ${TTS_ENDPOINT:-}
    volumes:
      - companion-state:/data
    expose:
      - "8787"

  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    depends_on:
      - companion-api
    ports:
      - "127.0.0.1:${HINA_DASHBOARD_PORT:-8080}:80"

volumes:
  hermes-data:
  companion-state:
