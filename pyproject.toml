[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hina-companion-system"
version = "0.1.0"
description = "Privacy-first proactive companion orchestration for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Camellya"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.15.10"]

[project.scripts]
hina-companion = "hina_companion.cli:main"
hina-dashboard-api = "hina_companion.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
